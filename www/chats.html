<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="www.browsePageTitle">Browse chats - Everchat</title>
    <meta
      name="description"
      content="Browse every public Everchat room. Search by title or URL."
      data-i18n="www.browseMetaDescription"
      data-i18n-attr="content"
    />
    <meta property="og:title" content="Browse chats - Everchat" />
    <meta
      property="og:description"
      content="Browse every public Everchat room. Search by title or URL."
    />
    <meta property="og:url" content="https://everch.at/chats" />
    <meta property="og:image" content="https://everch.at/assets/ec-og-image.png" />
    <meta property="og:image:width" content="2284" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://everch.at/assets/ec-og-image.png" />
    <link rel="canonical" href="https://everch.at/chats" />
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <meta name="referrer" content="no-referrer" />
    <script src="/boot-locale.js"></script>
  </head>
  <body class="m-0 min-h-screen bg-stone font-sans text-base leading-normal text-ink antialiased">
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="doc-bar">
      <a class="home block shrink-0 leading-none" href="/">
        <img
          class="shrink-0"
          src="/assets/ec-logo-horizontal-black.svg"
          width="560"
          height="130"
          alt="Everchat"
          data-i18n="www.brandAlt"
          data-i18n-attr="alt"
        />
      </a>
      <nav class="doc-bar-mid" aria-label="Site">
        <a href="/chats" data-i18n="www.navChats" aria-current="page">Chats</a>
        <a href="/themes" data-i18n="www.navThemes">Themes</a>
        <a href="https://buymeacoffee.com/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.donate">Support</a>
        <a href="https://github.com/erikfiala/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.footerSource">GitHub</a>
      </nav>
      <div class="doc-bar-end min-w-0 shrink">
        <div class="nav-lang min-w-0 shrink">
          <div class="ec-select" data-ec-lang>
            <button
              type="button"
              class="ec-select-trigger"
              data-ec-lang-trigger
              role="combobox"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-autocomplete="list"
              aria-label="Language"
              data-i18n="www.language"
              data-i18n-attr="aria-label"
            >
              <svg
                class="ec-select-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5 8 6 6" />
                <path d="m4 14 6-6 2-3" />
                <path d="M2 5h12" />
                <path d="M7 2h1" />
                <path d="m22 22-5-10-5 10" />
                <path d="M14 18h6" />
              </svg>
              <span class="ec-select-value" data-ec-lang-label></span>
              <svg
                class="ec-select-chevron"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div class="ec-select-menu" data-ec-lang-menu role="listbox" hidden></div>
          </div>
        </div>
        <div class="doc-bar-menu" data-ec-nav>
          <button
            type="button"
            class="doc-bar-burger"
            data-ec-nav-trigger
            aria-expanded="false"
            aria-controls="ec-site-nav"
            aria-haspopup="true"
            aria-label="Menu"
            data-i18n="www.navMenu"
            data-i18n-attr="aria-label"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 5h16" />
              <path d="M4 12h16" />
              <path d="M4 19h16" />
            </svg>
          </button>
          <div class="doc-bar-panel" id="ec-site-nav" data-ec-nav-panel hidden></div>
        </div>
      </div>
    </header>

    <main
      class="browse-main"
      data-ec-browse
      aria-busy="false"
    >
      <h1 data-i18n="www.browseTitle">
        All chats
      </h1>

      <label class="browse-search-label">
        <span class="sr-only" data-i18n="www.browseSearchAria">Search chats</span>
        <input
          class="browse-search"
          type="search"
          name="q"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="search"
          placeholder="Search by title or URL"
          data-ec-browse-search
          data-i18n="www.browseSearchPlaceholder"
          data-i18n-attr="placeholder"
        />
      </label>

      <p
        class="trending-status browse-status m-0 text-mute"
        data-ec-browse-status
        hidden
      ></p>

      <div
        class="trending-list browse-list grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"
        data-ec-browse-list
        aria-label="All chats"
        data-i18n="www.browseAria"
        data-i18n-attr="aria-label"
      ></div>

      <div class="browse-error" data-ec-browse-error hidden>
        <p class="m-0" data-ec-browse-error-text></p>
        <button type="button" class="browse-retry" data-ec-browse-retry data-i18n="chat.retry">
          Retry
        </button>
      </div>

      <p class="browse-more trending-status m-0 text-mute" data-ec-browse-more hidden></p>
      <p class="browse-end" data-ec-browse-end hidden></p>
      <div class="browse-sentinel" data-ec-browse-sentinel aria-hidden="true"></div>
    </main>

    <footer
      class="site-footer"
    >
      <img
        class="footer-mark"
        src="/assets/ec-logo-avatar-rounded.png"
        width="128"
        height="128"
        alt=""
      />
      <nav class="footer-links" aria-label="Footer" data-i18n="www.footerAria" data-i18n-attr="aria-label">
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/">Home</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="https://buymeacoffee.com/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.donate">Support</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="https://github.com/erikfiala/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.footerSource">GitHub</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/privacy" data-i18n="www.footerPrivacy">Privacy</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/terms" data-i18n="www.footerTerms">Terms</a>
      </nav>
      <p class="m-0 normal-case" data-i18n="www.footerTagline">© 2026 Everchat. Public comments on any URL.</p>
    </footer>
    <script src="/supabase-public.js"></script>
    <script src="/i18n.js"></script>
    <script src="/rooms.js"></script>
    <script src="/chats.js"></script>
    <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="everchat" data-description="Support me on Buy me a coffee!" data-message="" data-color="#FFDD00" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
    <script src="/bmc-widget.js"></script>
  </body>
</html>
