<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="www.themePageTitle">Theme - Everchat</title>
    <meta
      name="description"
      content="Preview a published Everchat theme and import it into the extension."
      data-i18n="www.themeMetaDescription"
      data-i18n-attr="content"
    />
    <meta property="og:title" content="Theme - Everchat" />
    <meta property="og:image" content="https://everch.at/assets/ec-og-image.png" />
    <meta property="og:image:width" content="2284" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://everch.at/assets/ec-og-image.png" />
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <meta name="referrer" content="no-referrer" />
    <script src="/boot-locale.js"></script>
  </head>
  <body class="m-0 min-h-screen bg-stone font-sans text-[1.0625rem] leading-[1.55] text-ink antialiased">
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="doc-bar sticky top-0 z-20 flex items-center justify-between gap-4 border-b border-line/70 bg-paper/86 px-[clamp(1.5rem,4vw,3rem)] py-4 backdrop-blur-[10px]">
      <a class="home block shrink-0 leading-none" href="/">
        <img
          class="h-auto w-[8.5rem] shrink-0 pb-1"
          src="/assets/ec-logo-horizontal-black.svg"
          width="560"
          height="130"
          alt="Everchat"
          data-i18n="www.brandAlt"
          data-i18n-attr="alt"
        />
      </a>
      <nav class="doc-bar-mid" aria-label="Site">
        <a href="/chats" data-i18n="www.navChats">Chats</a>
        <a href="/themes" data-i18n="www.navThemes">Themes</a>
        <a href="https://buymeacoffee.com/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.donate">Donate</a>
        <a href="https://github.com/erikfiala/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.footerSource">GitHub</a>
      </nav>
      <div class="doc-bar-end min-w-0 shrink">
        <div class="nav-lang min-w-0 shrink">
          <div class="ec-select" data-ec-lang>
            <button
              type="button"
              class="ec-select-trigger"
              data-ec-lang-trigger
              role="combobox"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-autocomplete="list"
              aria-label="Language"
              data-i18n="www.language"
              data-i18n-attr="aria-label"
            >
              <svg
                class="ec-select-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5 8 6 6" />
                <path d="m4 14 6-6 2-3" />
                <path d="M2 5h12" />
                <path d="M7 2h1" />
                <path d="m22 22-5-10-5 10" />
                <path d="M14 18h6" />
              </svg>
              <span class="ec-select-value" data-ec-lang-label></span>
              <svg
                class="ec-select-chevron"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div class="ec-select-menu" data-ec-lang-menu role="listbox" hidden></div>
          </div>
        </div>
        <div class="doc-bar-menu" data-ec-nav>
          <button
            type="button"
            class="doc-bar-burger"
            data-ec-nav-trigger
            aria-expanded="false"
            aria-controls="ec-site-nav"
            aria-haspopup="true"
            aria-label="Menu"
            data-i18n="www.navMenu"
            data-i18n-attr="aria-label"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 5h16" />
              <path d="M4 12h16" />
              <path d="M4 19h16" />
            </svg>
          </button>
          <div class="doc-bar-panel" id="ec-site-nav" data-ec-nav-panel hidden></div>
        </div>
      </div>
    </header>

    <main
      class="theme-detail-main relative z-1 mx-auto max-w-[72rem] px-[clamp(1.5rem,4vw,3rem)] pt-[clamp(2rem,6vw,3.5rem)] pb-[clamp(4rem,10vw,6rem)]"
      data-ec-theme-detail
      aria-busy="true"
    >
      <p class="theme-kicker">
        <a href="/themes" data-i18n="www.themesTitle">Themes</a>
      </p>
      <h1
        class="mb-2 font-display text-[clamp(1.35rem,3vw,1.75rem)] font-semibold leading-[1.2] tracking-[-0.03em]"
        data-ec-theme-title
      ></h1>
      <p class="theme-lede m-0 text-mute" data-ec-theme-by></p>

      <div class="theme-detail" hidden data-ec-theme-ready>
        <section class="theme-preview-col">
          <h2 class="theme-preview-label" data-i18n="www.themePreview">Preview</h2>
          <div class="ec-preview-frame">
            <iframe
              class="ec-preview-iframe"
              data-ec-preview-frame
              title="Everchat preview"
              src="/panel/"
              sandbox="allow-scripts allow-same-origin"
            ></iframe>
          </div>
        </section>
        <div class="theme-detail-actions">
          <button
            type="button"
            class="theme-like theme-like-detail"
            data-ec-theme-like
            hidden
            aria-pressed="false"
            aria-label="Like"
            data-i18n="www.themeLike"
            data-i18n-attr="aria-label"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
            <span class="theme-like-count" data-ec-theme-like-count>0</span>
          </button>
          <button type="button" class="theme-btn theme-btn-primary" data-ec-theme-import data-i18n="www.themeImport">
            Import this theme
          </button>
          <a class="theme-btn theme-btn-link" href="/#get-extension" data-ec-theme-install hidden data-i18n="www.themeInstall">
            Install Everchat
          </a>
          <p class="theme-status" data-ec-theme-status hidden></p>
        </div>
      </div>

      <div class="browse-error" data-ec-theme-error hidden>
        <p class="m-0" data-ec-theme-error-text></p>
        <a class="browse-retry" href="/themes" data-i18n="www.themesTitle">Themes</a>
      </div>
    </main>

    <footer
      class="site-footer grid justify-items-center gap-3 border-t border-line/70 px-[clamp(1.5rem,4vw,3rem)] pt-8 pb-10 text-center text-[0.8rem] text-mute"
    >
      <img
        class="footer-mark h-8 w-8 rounded-[0.45rem] opacity-90"
        src="/assets/ec-logo-avatar-rounded.png"
        width="128"
        height="128"
        alt=""
      />
      <nav class="footer-links flex flex-wrap justify-center gap-x-[0.55rem] gap-y-[0.35rem] text-[0.8rem]" aria-label="Footer" data-i18n="www.footerAria" data-i18n-attr="aria-label">
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/">Home</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="https://buymeacoffee.com/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.donate">Donate</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="https://github.com/erikfiala/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.footerSource">GitHub</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/privacy" data-i18n="www.footerPrivacy">Privacy</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/terms" data-i18n="www.footerTerms">Terms</a>
      </nav>
      <p class="m-0 normal-case" data-i18n="www.footerTagline">© 2026 Everchat. Public comments on any URL.</p>
    </footer>
    <script src="/supabase-public.js"></script>
    <script src="/i18n.js"></script>
    <script src="/theme-schema.js"></script>
    <script src="/theme.js"></script>
    <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="everchat" data-description="Support me on Buy me a coffee!" data-message="" data-color="#FFDD00" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
  </body>
</html>
