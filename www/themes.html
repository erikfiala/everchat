<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="www.themesPageTitle">Themes - Everchat</title>
    <meta
      name="description"
      content="Browse published Everchat skins. Colors, fonts, and spacing as JSON tokens."
      data-i18n="www.themesMetaDescription"
      data-i18n-attr="content"
    />
    <meta property="og:title" content="Themes - Everchat" />
    <meta
      property="og:description"
      content="Browse published Everchat skins. Colors, fonts, and spacing as JSON tokens."
    />
    <meta property="og:url" content="https://everch.at/themes" />
    <meta property="og:image" content="https://everch.at/assets/ec-og-image.png" />
    <meta property="og:image:width" content="2284" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://everch.at/assets/ec-og-image.png" />
    <link rel="canonical" href="https://everch.at/themes" />
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <meta name="referrer" content="no-referrer" />
    <script src="/boot-locale.js"></script>
  </head>
  <body class="m-0 min-h-screen bg-stone font-sans text-[1.0625rem] leading-[1.55] text-ink antialiased">
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="doc-bar sticky top-0 z-20 flex items-center justify-between gap-4 border-b border-line/70 bg-paper/86 px-[clamp(1.5rem,4vw,3rem)] py-4 backdrop-blur-[10px]">
      <a class="home block shrink-0 leading-none" href="/">
        <img
          class="h-auto w-[8.5rem] shrink-0 pb-1"
          src="/assets/ec-logo-horizontal-black.svg"
          width="560"
          height="130"
          alt="Everchat"
          data-i18n="www.brandAlt"
          data-i18n-attr="alt"
        />
      </a>
      <nav class="doc-bar-mid" aria-label="Site">
        <a href="/chats" data-i18n="www.navChats">Chats</a>
        <a href="/themes" data-i18n="www.navThemes" aria-current="page">Themes</a>
        <a href="https://buymeacoffee.com/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.donate">Donate</a>
        <a href="https://github.com/erikfiala/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.footerSource">GitHub</a>
      </nav>
      <div class="doc-bar-end min-w-0 shrink">
        <div class="nav-lang min-w-0 shrink">
          <div class="ec-select" data-ec-lang>
            <button
              type="button"
              class="ec-select-trigger"
              data-ec-lang-trigger
              role="combobox"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-autocomplete="list"
              aria-label="Language"
              data-i18n="www.language"
              data-i18n-attr="aria-label"
            >
              <svg
                class="ec-select-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5 8 6 6" />
                <path d="m4 14 6-6 2-3" />
                <path d="M2 5h12" />
                <path d="M7 2h1" />
                <path d="m22 22-5-10-5 10" />
                <path d="M14 18h6" />
              </svg>
              <span class="ec-select-value" data-ec-lang-label></span>
              <svg
                class="ec-select-chevron"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div class="ec-select-menu" data-ec-lang-menu role="listbox" hidden></div>
          </div>
        </div>
        <div class="doc-bar-menu" data-ec-nav>
          <button
            type="button"
            class="doc-bar-burger"
            data-ec-nav-trigger
            aria-expanded="false"
            aria-controls="ec-site-nav"
            aria-haspopup="true"
            aria-label="Menu"
            data-i18n="www.navMenu"
            data-i18n-attr="aria-label"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 5h16" />
              <path d="M4 12h16" />
              <path d="M4 19h16" />
            </svg>
          </button>
          <div class="doc-bar-panel" id="ec-site-nav" data-ec-nav-panel hidden></div>
        </div>
      </div>
    </header>

    <main
      class="themes-main relative z-1 mx-auto max-w-[72rem] px-[clamp(1.5rem,4vw,3rem)] pt-[clamp(2rem,6vw,3.5rem)] pb-[clamp(4rem,10vw,6rem)]"
      data-ec-themes
      aria-busy="false"
    >
      <div class="themes-head">
        <h1
          class="mb-5 font-display text-[clamp(1.35rem,3vw,1.75rem)] font-semibold leading-[1.2] tracking-[-0.03em]"
          data-i18n="www.themesTitle"
        >
          Themes
        </h1>
        <div class="themes-toolbar">
          <div class="ec-select themes-sort" data-ec-themes-sort>
            <button
              type="button"
              class="ec-select-trigger"
              data-ec-themes-sort-trigger
              role="combobox"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-autocomplete="list"
              aria-label="Sort themes"
              data-i18n="www.themesSort"
              data-i18n-attr="aria-label"
            >
              <svg
                class="ec-select-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m21 16-4 4-4-4" />
                <path d="M17 20V4" />
                <path d="m3 8 4-4 4 4" />
                <path d="M7 4v16" />
              </svg>
              <span class="ec-select-value" data-ec-themes-sort-label>Best</span>
              <svg
                class="ec-select-chevron"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div class="ec-select-menu" data-ec-themes-sort-menu role="listbox" hidden></div>
          </div>
          <a class="browse-all-link themes-new-link" href="/themes/new">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
            <span data-i18n="www.themesNew">New theme</span>
          </a>
        </div>
      </div>

      <p class="trending-status browse-status m-0 text-mute" data-ec-themes-status hidden></p>

      <div
        class="theme-list grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
        data-ec-themes-list
        aria-label="Published themes"
        data-i18n="www.themesAria"
        data-i18n-attr="aria-label"
      ></div>

      <div class="browse-error" data-ec-themes-error hidden>
        <p class="m-0" data-ec-themes-error-text></p>
        <button type="button" class="browse-retry" data-ec-themes-retry data-i18n="chat.retry">
          Retry
        </button>
      </div>
    </main>

    <footer
      class="site-footer grid justify-items-center gap-3 border-t border-line/70 px-[clamp(1.5rem,4vw,3rem)] pt-8 pb-10 text-center text-[0.8rem] text-mute"
    >
      <img
        class="footer-mark h-8 w-8 rounded-[0.45rem] opacity-90"
        src="/assets/ec-logo-avatar-rounded.png"
        width="128"
        height="128"
        alt=""
      />
      <nav class="footer-links flex flex-wrap justify-center gap-x-[0.55rem] gap-y-[0.35rem] text-[0.8rem]" aria-label="Footer" data-i18n="www.footerAria" data-i18n-attr="aria-label">
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/">Home</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="https://buymeacoffee.com/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.donate">Donate</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="https://github.com/erikfiala/everchat" target="_blank" rel="noopener noreferrer" data-i18n="www.footerSource">GitHub</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/privacy" data-i18n="www.footerPrivacy">Privacy</a>
        <span class="footer-sep text-mute" aria-hidden="true">·</span>
        <a class="text-ink-soft no-underline hover:text-accent hover:underline" href="/terms" data-i18n="www.footerTerms">Terms</a>
      </nav>
      <p class="m-0 normal-case" data-i18n="www.footerTagline">© 2026 Everchat. Public comments on any URL.</p>
    </footer>
    <script src="/supabase-public.js"></script>
    <script src="/i18n.js"></script>
    <script src="/theme-schema.js"></script>
    <script src="/themes.js"></script>
  </body>
</html>
